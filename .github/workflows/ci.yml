name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Pinned image: its preinstalled Node and Python 3.12 are the gate's
    # Node and Python (verify.sh needs Python 3.11+).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # Full repo gate with the algal pin from scripts/verify.sh. Offline
      # replays only: no provider credentials are needed or provided.
      - run: bash scripts/verify.sh

  required:
    name: Required
    if: always()
    needs: [verify]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          VERIFY: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          [[ "$VERIFY" == success ]]
